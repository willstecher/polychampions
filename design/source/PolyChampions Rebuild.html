<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PolyChampions — Facelift POC (real content)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  details > summary::-webkit-details-marker { display: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="houses-data.jsx"></script>
<script type="text/babel" src="shared-primitives.jsx"></script>
<script type="text/babel" src="ia-doc.jsx"></script>

<script type="text/babel" src="direction-hex-home.jsx"></script>
<script type="text/babel" src="direction-hex-pages.jsx"></script>
<script type="text/babel" src="direction-hex.jsx"></script>

<script type="text/babel" src="direction-atlas-home.jsx"></script>
<script type="text/babel" src="direction-atlas-pages.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <window.DesignCanvas>
      <window.DCSection id="ia" title="Information architecture" subtitle="Sitemap + facelift brief — sourced from your WordPress export 2026-05-20">
        <window.DCArtboard id="ia-doc" label="Sitemap & brief" width={1280} height={760}>
          <window.IADoc />
        </window.DCArtboard>
      </window.DCSection>

      <window.DCSection id="hex" title="Direction A · HEX" subtitle="Polytopia-native — hex grids, vibrant tribe colors, geometric sans. Use the nav inside to walk all 10 pages.">
        <window.DCArtboard id="hex-proto" label="Interactive prototype · all real content" width={1440} height={2400}>
          <window.HexPrototype />
        </window.DCArtboard>
      </window.DCSection>

      <window.DCSection id="atlas" title="Direction B · ATLAS" subtitle="Editorial broadcast — dark mode, ceremonial gold, Newsreader serif. Use the nav inside to walk all 10 pages.">
        <window.DCArtboard id="atlas-proto" label="Interactive prototype · all real content" width={1440} height={2400}>
          <window.AtlPrototype />
        </window.DCArtboard>
      </window.DCSection>
    </window.DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
